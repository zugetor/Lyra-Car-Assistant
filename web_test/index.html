<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyra Car Assistant · Web test</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #16181d; --muted: #646b78; --line: #e3e6eb;
    --accent: #2563eb; --ok: #15803d; --ok-bg: #e7f6ec; --warn: #b45309; --warn-bg: #fdf1dc;
    --bad: #b91c1c; --bad-bg: #fde8e8; --bar: #dbe3f3; --chip: #eef1f5; --mono-bg: #f1f4f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --ink: #e8eaee; --muted: #98a0ad; --line: #272c36;
      --accent: #6aa0ff; --ok: #4ade80; --ok-bg: #12301d; --warn: #fbbf24; --warn-bg: #33270d;
      --bad: #f87171; --bad-bg: #3a1616; --bar: #263048; --chip: #222733; --mono-bg: #11151c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Sukhumvit Set", "Noto Sans Thai", "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between;
    padding: 16px 24px; border-bottom: 1px solid var(--line); background: var(--card);
  }
  .brand { font-weight: 700; font-size: 17px; }
  .brand span { color: var(--muted); font-weight: 500; }
  .meta { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; padding: 20px 24px; max-width: 1280px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); padding: 16px; } header { padding: 14px 16px; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 20px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type=text] {
    flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button, select {
    font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 0 14px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .action {
    font: 600 20px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--mono-bg);
    border-radius: 10px; padding: 12px 14px; overflow-wrap: anywhere;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; letter-spacing: .02em; }
  .b-ok { background: var(--ok-bg); color: var(--ok); }
  .b-warn { background: var(--warn-bg); color: var(--warn); }
  .b-bad { background: var(--bad-bg); color: var(--bad); }
  .said { color: var(--muted); }
  table.kv { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 14px; }
  table.kv td { padding: 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
  table.kv td:first-child { color: var(--muted); width: 130px; padding-right: 12px; }
  .conf { display: flex; align-items: center; gap: 10px; }
  .bar { position: relative; flex: 1; max-width: 220px; height: 8px; border-radius: 4px; background: var(--bar); }
  .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); }
  .bar b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--warn); }
  .num { font-variant-numeric: tabular-nums; }
  .alts { color: var(--muted); font-size: 13px; }
  .toks { display: flex; flex-wrap: wrap; gap: 4px; }
  .tok { background: var(--chip); border-radius: 6px; padding: 1px 6px; font: 13px ui-monospace, Menlo, monospace; }
  .empty { color: var(--muted); }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .filters button { padding: 4px 10px; font-size: 13px; border-radius: 999px; }
  .filters button.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .group { margin-bottom: 10px; }
  .group-name { font: 600 12px ui-monospace, Menlo, monospace; color: var(--muted); margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 14px; padding: 5px 10px; border-radius: 8px; background: var(--chip); border: 1px solid transparent;
    cursor: pointer; text-align: left; line-height: 1.35;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.ok { border-color: var(--ok); }
  .chip.bad { border-color: var(--bad); background: var(--bad-bg); }
  #hist { list-style: none; margin: 0; padding: 0; font-size: 14px; }
  #hist li { padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
  #hist li:first-child { border-top: 0; }
  #hist .h-act { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .eval-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .eval-btns button { padding: 8px 12px; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin: 14px 0 6px; }
  .stat { background: var(--mono-bg); border-radius: 10px; padding: 10px 12px; }
  .stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 12px; color: var(--muted); }
  table.miss { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  table.miss th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 4px; }
  table.miss td { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  .err { color: var(--bad); }
</style>
</head>
<body>
<header>
  <div class="brand">Lyra Car Assistant <span>· Web test</span></div>
  <div class="meta" id="model">loading model…</div>
</header>
<main>
  <section>
    <form id="f">
      <input type="text" id="q" placeholder="พิมพ์คำสั่ง เช่น เปิดฝาท้ายหน่อย · Open the tailgate" autocomplete="off" autofocus>
      <button type="submit" class="primary" id="send">Send</button>
    </form>
    <div class="card" id="result"><div class="empty">Type a command or pick one below.</div></div>
    <div class="card">
      <h2>Labeled commands</h2>
      <div class="filters" id="filters"></div>
      <div id="presets"></div>
    </div>
  </section>
  <section>
    <div class="card">
      <h2>Eval sets</h2>
      <div class="eval-btns">
        <button data-set="heldout">Run held-out</button>
        <button data-set="tuning">Run tuning</button>
      </div>
      <div id="evalOut"></div>
    </div>
    <div class="card">
      <h2>History</h2>
      <ol id="hist"><li class="empty" style="cursor:default">Nothing yet.</li></ol>
    </div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmt = (o) => o == null ? "no car action (none)" : esc(JSON.stringify(o));
const pct = (x) => (x * 100).toFixed(1) + "%";
let INFO = null, history = [], filter = {set: "heldout", lang: "all"};

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function expectedMatches(exp, r) {
  if (!exp) return null;
  if (exp.control !== r.control) return false;
  if (exp.payload === "-") return true;
  return /^\d+$/.test(exp.payload) ? r.payload === Number(exp.payload) : r.payload === exp.payload;
}

function bar(v, line, label, lineTitle) {
  const w = Math.max(0, Math.min(1, v)) * 100;
  const tick = line != null ? `<b style="left:${(line * 100).toFixed(1)}%" title="${lineTitle}"></b>` : "";
  const low = line != null && v < line;
  return `<div class="conf"><div class="bar"><i style="width:${w}%"></i>${tick}</div>
    <span class="num">${v.toFixed(3)}</span><span class="alts">${label}${line != null ? ` · ask again below ${line}` : ""}${low ? " · below" : ""}</span></div>`;
}

function gateRows(margin, conf, thr) {
  // the active gate gets the bar; the other one is shown as a note
  if (INFO.gate === "margin") {
    return bar(margin, INFO.margin, "lead over runner-up", "margin gate") +
      `<div class="alts">laya confidence ${conf.toFixed(4)}${thr != null ? ` (laya gate: ${conf < thr ? "would ask again" : "ok"} at ${thr})` : ""}</div>`;
  }
  return bar(conf, thr, "laya confidence", "laya threshold") +
    `<div class="alts">lead over runner-up ${margin.toFixed(3)}</div>`;
}

function render(r, exp) {
  const m = expectedMatches(exp, r);
  const badge = r.ask_again
    ? `<span class="badge b-warn" title="${esc(r.ask_again_reasons.join("; "))}">ASK AGAIN</span>`
    : `<span class="badge b-ok">ACT</span>`;
  const reasons = r.ask_again ? `<div class="alts" style="margin-top:6px">${r.ask_again_reasons.map(esc).join("<br>")}</div>` : "";
  const check = m === null ? "" : m ? `<span class="badge b-ok">✓ matches label</span>`
    : `<span class="badge b-bad">✗ expected ${esc(exp.control)} = ${esc(exp.payload)}</span>`;
  const alts = r.control_top.slice(1).map(([k, p]) => `${esc(k)} ${p.toFixed(3)}`).join(" · ");
  const payload = r.payload == null ? "—" : `<span class="mono">${esc(r.payload)}</span> <span class="alts">${esc(r.payload_source)}</span>`;
  const palts = r.payload_top ? r.payload_top.slice(1).map(([k, p]) => `${esc(k)} ${p.toFixed(3)}`).join(" · ") : "";
  $("#result").innerHTML = `
    <div class="said">“${esc(r.text)}”</div>
    <div class="action" style="margin-top:8px">${fmt(r.action)}</div>
    <div class="row">${badge}${check}<span class="alts">gate: ${esc(r.gate)}</span></div>${reasons}
    <table class="kv">
      <tr><td>control</td><td><span class="mono">${esc(r.control)}</span>
        ${r.control_label !== r.control ? `<span class="alts">(model sees “${esc(r.control_label)}”)</span>` : ""}
        ${gateRows(r.control_margin, r.control_confidence, r.control_threshold)}<div class="alts">next: ${alts}</div></td></tr>
      <tr><td>payload</td><td>${payload}
        ${r.payload_confidence != null ? gateRows(r.payload_margin, r.payload_confidence, r.payload_threshold) + `<div class="alts">next: ${palts}</div>` : ""}</td></tr>
      <tr><td>latency</td><td class="num">${r.ms.total} ms <span class="alts">control ${r.ms.control} + payload ${r.ms.payload}</span></td></tr>
      <tr><td>tokens (${r.tokens.length})</td><td><div class="toks">${r.tokens.map((t) => `<span class="tok">${esc(t)}</span>`).join("")}</div></td></tr>
    </table>`;
}

function addHistory(r, exp) {
  const m = expectedMatches(exp, r);
  history.unshift({r, exp, m});
  history = history.slice(0, 30);
  $("#hist").innerHTML = history.map((h, i) => `<li data-i="${i}">
    ${h.m === null ? "" : h.m ? "✓ " : "✗ "}${esc(h.r.text)}
    <div class="h-act">${fmt(h.r.action)} <span class="alts">${h.r.control_confidence.toFixed(3)} · ${h.r.ms.total} ms${h.r.ask_again ? " · ask again" : ""}</span></div></li>`).join("");
}

async function decide(text, exp, chip) {
  text = text.trim();
  if (!text) return;
  $("#send").disabled = true;
  try {
    const r = await api("/api/decide", {text});
    render(r, exp);
    addHistory(r, exp);
    if (chip) chip.classList.add(expectedMatches(exp, r) ? "ok" : "bad");
  } catch (e) {
    $("#result").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  } finally {
    $("#send").disabled = false;
    $("#q").select();   // the next typed command replaces this one
  }
}

function renderPresets() {
  const sets = [["heldout", "Held-out"], ["tuning", "Tuning"]], langs = [["all", "All"], ["th", "ไทย"], ["en", "English"]];
  $("#filters").innerHTML =
    sets.map(([k, v]) => `<button data-f="set" data-v="${k}" class="${filter.set === k ? "on" : ""}">${v}</button>`).join("") +
    `<span style="width:8px"></span>` +
    langs.map(([k, v]) => `<button data-f="lang" data-v="${k}" class="${filter.lang === k ? "on" : ""}">${v}</button>`).join("");
  const rows = INFO.presets.filter((p) => p.set === filter.set && (filter.lang === "all" || p.lang === filter.lang));
  const groups = {};
  rows.forEach((p) => (groups[p.control] = groups[p.control] || []).push(p));
  $("#presets").innerHTML = Object.entries(groups).map(([c, ps]) => `<div class="group">
      <div class="group-name">${esc(c)}</div>
      <div class="chips">${ps.map((p) => `<button class="chip" data-text="${esc(p.text)}" data-c="${esc(p.control)}" data-p="${esc(p.payload)}"
        title="expected ${esc(p.control)} = ${esc(p.payload)}">${esc(p.text)}</button>`).join("")}</div></div>`).join("");
}

async function runEval(set, btn) {
  btn.disabled = true;
  $("#evalOut").innerHTML = `<p class="alts">Running ${set} through the model…</p>`;
  try {
    const e = await api("/api/eval", {set});
    $("#evalOut").innerHTML = `
      <div class="summary">
        <div class="stat"><div class="v">${pct(e.control / e.n)}</div><div class="k">control (${e.control}/${e.n})</div></div>
        <div class="stat"><div class="v">${pct(e.end_to_end / e.n)}</div><div class="k">whole command (${e.end_to_end}/${e.n})</div></div>
        <div class="stat"><div class="v">${e.ask_again}</div><div class="k">ask again (${esc(e.gate)} gate)</div></div>
        <div class="stat"><div class="v">${e.laya_gate_would_ask}</div><div class="k">ask again (laya gate)</div></div>
        <div class="stat"><div class="v">${e.median_ms}</div><div class="k">median ms</div></div>
      </div>
      ${e.misses.length ? `<table class="miss"><tr><th>command</th><th>expected</th><th>got</th></tr>
        ${e.misses.map((m) => `<tr><td>${esc(m.text)}</td><td class="mono">${fmt(m.expected)}</td>
          <td class="mono">${fmt(m.got)}${m.ask_again ? ' <span class="badge b-warn">ask again</span>' : ""}</td></tr>`).join("")}</table>`
        : `<p class="alts">No misses.</p>`}`;
  } catch (err) {
    $("#evalOut").innerHTML = `<div class="err">${esc(err.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
}

$("#f").addEventListener("submit", (e) => { e.preventDefault(); decide($("#q").value); });
$("#filters").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-f]");
  if (!b) return;
  filter[b.dataset.f] = b.dataset.v;
  renderPresets();
});
$("#presets").addEventListener("click", (e) => {
  const c = e.target.closest(".chip");
  if (!c) return;
  $("#q").value = c.dataset.text;
  decide(c.dataset.text, {control: c.dataset.c, payload: c.dataset.p}, c);
});
$("#hist").addEventListener("click", (e) => {
  const li = e.target.closest("li[data-i]");
  if (li) render(history[li.dataset.i].r, history[li.dataset.i].exp);
});
document.querySelectorAll(".eval-btns button").forEach((b) => b.addEventListener("click", () => runEval(b.dataset.set, b)));

(async () => {
  try {
    INFO = await api("/api/info");
    $("#model").textContent = `${INFO.backend} · ${INFO.model_mb} MB · vocab ${INFO.vocab.toLocaleString()} · ${INFO.controls.length} options · ` +
      `gate ${INFO.gate}${INFO.gate === "margin" ? ` (< ${INFO.margin})` : ""} · loaded in ${INFO.load_s}s`;
    renderPresets();
  } catch (e) {
    $("#model").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
})();
</script>
</body>
</html>
