# Builds the browser demo with web_browser/build_pages.py and publishes it on GitHub Pages.
# The model isn't part of the site: visitors' browsers fetch it from Hugging Face.
# One-time setup on GitHub: Settings -> Pages -> Source: GitHub Actions.
name: Pages demo

on:
  push:
    branches: [master]
    paths:
      - web_browser/**
      - eval_heldout.tsv
      - eval_commands.tsv
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: python3 web_browser/build_pages.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
